modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
NeroAgriculture - multiloader build (Forge).
'''

[[mixins]]
config = "neroagriculture-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core is the required shared foundation and must load first.
[[dependencies.${mod_id}]]
modId = "nerolandcore"
mandatory = true
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"

# Nerospace is OPTIONAL. When present it must load first, so its public api is available the first time
# the environment bridge queries it; when absent the bridge stays dormant and the local model is used.
[[dependencies.${mod_id}]]
modId = "nerospace"
mandatory = false
versionRange = "${nerospace_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
