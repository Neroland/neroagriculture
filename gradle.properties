## EMI — optional recipe-viewer compat. Official EMI has no MC 26.x release, so this pins the community
## "EMI Unofficial Port (Unstable)" (CurseForge project 1544558, MIT, upstream dev.emi.emi.api unchanged),
## fetched through CurseMaven by CurseForge FILE id. NeoForge + Fabric only; the Forge cells compile
## against the NeoForge file (API only). Dev clients load EMI only with -PwithEmi.
## Minecraft 1.21.x: official EMI (dev.emi, TerraformersMC maven) exists only for 1.21.1; the other 1.21.x
## lines have no EMI at all, so their jars leave compat/emi out.
emi_version_1.21.1=1.1.24+1.21.1
emi_file_neoforge_26.1.2=8630349
emi_file_neoforge_26.2=8616659
emi_file_neoforge_26.3=8897084
emi_file_fabric_26.1.2=8630346
emi_file_fabric_26.2=8616656
emi_file_fabric_26.3=8897080

## Neroland Core — required shared foundation library; loads before NeroAgriculture.
## Consumed per-loader as za.co.neroland.nerolandcore:nerolandcore-<loader>-<mc>:<this>.
## Resolve from GitHub Packages in CI/fresh clones, or mavenLocal() for local development
## after running `./gradlew publishToMavenLocal` in ../neroland-core. See USING-CORE.md.
nerolandcore_version=1.17.0

## Nerospace — OPTIONAL sibling mod, consumed compileOnly for its public `za.co.neroland.nerospace.api`
## surface (environment/atmosphere queries and bounded oxygen contributions). Consumed per-loader as
## za.co.neroland.nerospace:nerospace-<loader>-<mc>:<this>, resolved from mavenLocal() or GitHub Packages
## exactly like Core. It is compile-only on purpose: NeroAgriculture never hard-depends on a sibling mod,
## and compat/nerospace/NerospaceEnvironmentBridge keeps every Nerospace type behind a lazily loaded
## holder class so the mod runs unchanged with Nerospace absent.
## Nerospace 2.0.0-alpha.1 is the published release for every cell here (Minecraft 1.21.x and 26.x) and reworked the
## planets/visits API, so it is the floor every cell compiles against. The value is also the floor of the
## optional `nerospace` dependency range in the loader metadata.
nerospace_version=2.0.0-alpha.1

